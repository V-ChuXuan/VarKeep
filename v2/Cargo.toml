[package]
name = "varkeep"
version = "2.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "VarKeep - local-first Windows environment variable snapshots"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[build-dependencies]
winresource = "=0.1.31"

[package.metadata.winresource]
ProductName = "VarKeep"
FileDescription = "VarKeep - Windows environment variable snapshots"
OriginalFilename = "varkeep.exe"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
